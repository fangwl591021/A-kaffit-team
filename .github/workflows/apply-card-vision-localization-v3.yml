name: Apply Card Vision Localization V3

on:
  push:
    branches:
      - agent/card-scanner-v2
    paths:
      - scripts/apply-card-vision-localization-v3.mjs
      - .github/workflows/apply-card-vision-localization-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-scanner-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-card-vision-localization-v3.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Check
        run: npm run check
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/card-collection.js src/index.js public/app.js test/card-vision-localization-v3.test.js
          git commit -m "feat: use one-pass Vision OCR and card localization"
          git push origin HEAD:agent/card-scanner-v2
